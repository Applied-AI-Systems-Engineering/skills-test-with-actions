name: Instructor baseline coverage
on:
  pull_request:
    branches: [main]
    paths: [".github/workflows/baseline-coverage.yml"]
permissions:
  contents: read
jobs:
  baseline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install instructor baseline dependencies
        run: |
          python -m venv .venv/calculations
          source .venv/calculations/bin/activate
          pip install -r requirements.txt
          pip install pytest coverage pytest-cov
      - name: Run instructor baseline command
        run: |
          source .venv/calculations/bin/activate
          pytest --cov=src --verbose
